cargo-features = ["edition2024"] # For rust-analyzer to work

[package]
name = "audquotes"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
bsky-sdk = "0.1.16"
glob = "0.3.2"
grep = "0.3.2"
rand = "0.9.0"
redis = { version = "0.29.1", features = ["aio", "tokio-comp"] }
tokio = { version = "1.44.0", features = ["full"] }
tokio-cron-scheduler = "0.13.0"
